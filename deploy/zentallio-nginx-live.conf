# ===========================================================================
#  Mobile routing  (m.zentallio.com)
# ===========================================================================
# Ye wahi faisla karta hai jo Vercel par middleware.js karta: phone ko
# m.zentallio.com par bhejo, baqi sab ko desktop. Yahan koi hardcoded page
# list nahi -- nginx seedha dekh leta hai ke m/<path>.html maujood hai ya
# nahi, is liye naya page add karne par ye file chhedni nahi parti.
#
# NOTE: ye do `map` blocks server{} ke BAHAR hone chahiye. sites-enabled ki
# file khud http{} ke andar include hoti hai, is liye file ke top par rakhna
# theek hai -- bas kisi server{} block ke andar mat daalna.

map $http_user_agent $zen_mobile_ua {
    default 0;
    "~*iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|BB10|Opera Mini|IEMobile" 1;
}

# zv cookie hamesha UA par bhaari hai -- user ka chunav pehle.
map "$zen_mobile_ua:$cookie_zv" $zen_go_mobile {
    default        0;
    "~^\d:desktop$" 0;
    "~^1:"           1;
    "~^\d:mobile$"  1;
}

# Drop-in replacement for /etc/nginx/sites-enabled/zentallio on the Hetzner
# box (erp@...). This mirrors the file's ACTUAL current structure (checked
# 2026-08-11) — same Certbot-managed cert block, same server_name — with three
# fixes layered in:
#
#   1. `location /` now tries `$uri.html` first (cleanUrls), instead of the
#      SPA-style `try_files $uri $uri/ /index.html` fallback that was silently
#      serving index.html for /contact, /about, etc. That was the bug where
#      the URL bar changed but the homepage kept rendering.
#   2. `location ^~ /api/` proxies to api-server.js on 127.0.0.1:3001 (needs
#      the zentallio-api systemd service — see deploy/README.md).
#   3. Security denies so .env, .git, lib/, deploy/ are never servable, plus
#      long-lived caching for images/video/fonts.
#
# Install (on the server):
#   sudo cp /var/www/zentallio/deploy/zentallio-nginx-live.conf \
#           /etc/nginx/sites-enabled/zentallio
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Do this AFTER `deploy/deploy.sh` has synced the repo to /var/www/zentallio,
# so this file already exists there under deploy/.)

server {
    server_name zentallio.com www.zentallio.com;
    root /var/www/zentallio;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;
    index index.html;

    client_max_body_size 2m;

    # ---- old fashion PDF-style URL -> canonical page ----
    location = /fashion/Zentallio-Fashion-Sector-Solutions-v7.0.html {
        return 301 /fashion/sector-solutions;
    }
    location = /fashion/Zentallio-Fashion-Sector-Solutions-v7.0 {
        return 301 /fashion/sector-solutions;
    }

    # ---- trailingSlash:false -> /about/ redirects to /about ----
    rewrite ^/(.+)/$ /$1 permanent;

    # ---- API (^~ required: stops nginx evaluating the regex blocks below for /api/*) ----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # api/chat.js runs a multi-hop Claude tool loop -- it needs room.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_buffering off;
    }

    # ---- never serve source or config out of the webroot ----
    location ~ ^/(lib|deploy|tools|node_modules)/ { deny all; }
    location ~ /\.                          { deny all; }   # .git, .env, dotfiles
    location ~ \.(md|sh|py|json)$           { deny all; }   # README, package.json, dev-server.py

    # ---- long-lived assets ----
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # css/js change with each deploy -- revalidate instead of caching hard
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ---- mobile device -> m.zentallio.com --------------------------------
    # 418 sirf ek internal signal hai taake named location par ja sakein;
    # client ko ye kabhi nahi dikhta.
    location = / {
        error_page 418 = @zen_mobile_root;
        if ($zen_go_mobile) { return 418; }
        try_files /index.html =404;
    }
    location @zen_mobile_root {
        return 302 https://m.zentallio.com/;
    }

    # ---- cleanUrls: /about -> about.html, /fashion -> fashion.html ----
    # $uri.html tried FIRST on purpose: both fashion.html and a fashion/
    # directory exist, and /fashion must serve the page, not the directory.
    location / {
        error_page 418 = @zen_maybe_mobile;
        if ($zen_go_mobile) { return 418; }
        try_files $uri.html $uri $uri/ =404;
    }

    # Redirect sirf tab jab us page ka mobile version waqai maujood ho --
    # warna m. wapas yahan bhejta aur dono ke beech loop ban jaata.
    location @zen_maybe_mobile {
        if (-f "$document_root/m$uri.html") {
            return 302 https://m.zentallio.com$uri$is_args$args;
        }
        try_files $uri.html $uri $uri/ =404;
    }

    # ---- security headers ----
    add_header Vary                      "User-Agent" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zentallio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zentallio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.zentallio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zentallio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name zentallio.com www.zentallio.com;
    return 404; # managed by Certbot
}

# ===========================================================================
#  m.zentallio.com -- mobile version
# ===========================================================================
# Alag domain, magar wahi files aur wahi backend. Root /var/www/zentallio hi
# rehta hai; pages m/ ke andar se serve hote hain aur URL badalta nahi.
#
# SSL pehle issue karo:
#   sudo certbot --nginx -d m.zentallio.com
server {
    server_name m.zentallio.com;
    root /var/www/zentallio;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    client_max_body_size 2m;

    # ---- API: wahi backend jo apex use karta hai ----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
    }

    # ---- source / config kabhi serve na ho ----
    location ~ ^/(lib|deploy|tools|node_modules)/ { deny all; }
    location ~ /\.                          { deny all; }
    location ~ \.(md|sh|py|json)$           { deny all; }

    # ---- assets: wahi files, apex jaisi caching ----
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ---- trailingSlash:false ----
    rewrite ^/(.+)/$ /$1 permanent;

    # ---- root -> m/home.html (index.html nahi: dekho docs/MOBILE.md) ----
    location = / {
        if ($cookie_zv = "desktop") { return 302 https://zentallio.com/; }
        try_files /m/home.html =404;
    }

    # ---- baqi pages: m/<path>.html ----
    # Jo page m/ mein nahi, ya jis user ne "Desktop site" chuna -- usay wapas
    # apex par bhej do. 404 kabhi nahi dikhate.
    location / {
        if ($cookie_zv = "desktop") { return 302 https://zentallio.com$uri$is_args$args; }
        try_files /m$uri.html /m$uri @zen_to_desktop;
    }
    location @zen_to_desktop {
        return 302 https://zentallio.com$uri$is_args$args;
    }

    add_header Vary                      "User-Agent" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # certbot ye block khud bhar dega -- `certbot --nginx -d m.zentallio.com`
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/m.zentallio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.zentallio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = m.zentallio.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name m.zentallio.com;
    return 404;
}
