# Zentallio website — nginx site config
#
# Reproduces vercel.json (cleanUrls: true, trailingSlash: false, redirects)
# and proxies /api/* to the Node process from api-server.js.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/zentallio
#           sudo ln -s /etc/nginx/sites-available/zentallio /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# NOTE ON LOCATION ORDER -- nginx matches regex locations BEFORE plain prefix
# locations, so the order of blocks below is deliberate:
#   1. "=" exact matches (the redirects)
#   2. "^~" for /api/  -- the ^~ is REQUIRED: it stops nginx from evaluating
#      the regex blocks, which would otherwise deny or mis-serve API requests
#   3. deny regexes, before the asset regexes, so that e.g. /lib/booking-core.js
#      is blocked rather than matching the \.(css|js)$ rule and being served
#   4. asset regexes
#   5. "location /" fallback with the cleanUrls try_files

upstream zentallio_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name zentallio.com www.zentallio.com;

    root /var/www/zentallio-website;
    index index.html;

    client_max_body_size 2m;

    access_log /var/log/nginx/zentallio.access.log;
    error_log  /var/log/nginx/zentallio.error.log;

    # ---- 1. vercel.json "redirects" ----
    location = /fashion/Zentallio-Fashion-Sector-Solutions-v7.0.html {
        return 301 /fashion/sector-solutions;
    }
    location = /fashion/Zentallio-Fashion-Sector-Solutions-v7.0 {
        return 301 /fashion/sector-solutions;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    # ---- trailingSlash: false  ->  /about/ redirects to /about ----
    # ^/(.+)/$ does not match "/" itself, so the homepage is unaffected.
    rewrite ^/(.+)/$ /$1 permanent;

    # ---- 2. API  (^~ is load-bearing, see note at top) ----
    location ^~ /api/ {
        proxy_pass http://zentallio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # api/chat.js runs a multi-hop Claude tool loop -- it needs room.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_buffering off;
    }

    # ---- 3. never serve source or config out of the webroot ----
    location ~ ^/(lib|deploy|node_modules)/ { deny all; }
    location ~ /\.                          { deny all; }   # .git, .env, dotfiles
    location ~ \.(md|sh|py|json)$           { deny all; }   # README, vercel.json, dev-server.py

    # ---- 4. long-lived assets ----
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # css/js change with each deploy -- revalidate instead of caching hard
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ---- 5. cleanUrls: /about -> about.html ----
    # $uri.html is tried FIRST on purpose: both fashion.html and a fashion/
    # directory exist, and /fashion must serve the page, not the directory.
    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    # ---- security headers ----
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;
    # mp4/jpg/png are already compressed -- do not waste CPU on them.
}

# ---------------------------------------------------------------------------
# certbot rewrites the block above to listen on 443 and adds the http->https
# redirect automatically -- no manual TLS config needed here.
# See deploy/README.md step 6.
# ---------------------------------------------------------------------------
