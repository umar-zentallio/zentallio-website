<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="zentallio-version" content="pos-demo-4.0">
<title>Zentallio · Point of Sale — Guided Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C18;--panel:#0A1020;--panel-2:#0C1322;--raised:#0E1526;--s2:#111A2C;--s3:#16223A;
  --ink:#fff;--muted:#AEB9CB;--subtle:#6E7A90;--inv:#04121A;
  --line:rgba(255,255,255,.08);--lineS:rgba(255,255,255,.15);
  --teal:#15F2F2;--mint:#3FD9A4;--amber:#E5A24B;--danger:#E8795E;--blue:#7B8FF5;--ai:#FF2D95;
  --tealBg:#07232B;--tealInk:#7DEAEF;--mintBg:#0E2A1F;--mintInk:#A6E6C8;--amberBg:#2A2009;--amberInk:#E8BD78;
  --dangerBg:#2A1310;--dangerInk:#F0A8A3;--blueBg:#12173A;--blueInk:#AEBBFF;--aiBg:#20091A;--aiInk:#FF8FC0;
  --r-sm:7px;--r:11px;--r-lg:15px;--sh:0 2px 10px rgba(0,0,0,.5);--shL:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.45;letter-spacing:-.005em}
.mono{font-family:'JetBrains Mono',monospace}.serif{font-family:'Fraunces',Georgia,serif}
h1,h2,h3,h4{margin:0}button{font-family:inherit;cursor:pointer}
.wrap{display:grid;grid-template-columns:252px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--panel);border-right:.5px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 16px 14px;border-bottom:.5px solid var(--line);display:flex;align-items:center;gap:10px}
.bmark{width:30px;height:30px;border-radius:8px;background:var(--teal);color:var(--inv);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:17px;font-weight:600;flex-shrink:0}
.bname{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1}
.bsub{font-size:10px;color:var(--subtle);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.rail-scroll{flex:1;overflow-y:auto;padding:10px 8px}
.chap{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:var(--subtle);text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.rstep{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);margin-bottom:1px}
.rstep:hover{background:var(--s2);color:var(--ink)}
.rstep.on{background:var(--s3);color:var(--ink)}
.rstep .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--lineS);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--subtle);flex-shrink:0}
.rstep.on .n{background:var(--teal);border-color:var(--teal);color:var(--inv)}
.rstep.done .n{border-color:var(--mint);color:var(--mint)}
.rstep .l{font-size:12.5px;font-weight:600}
.rfoot{padding:10px 14px;border-top:.5px solid var(--line);font-size:10px;color:var(--subtle)}
.rfoot b{color:var(--muted)}
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:.5px solid var(--line);background:var(--panel);flex-shrink:0}
.tb-title{font-size:15px;font-weight:600}
.tb-crumb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--subtle);text-transform:uppercase}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amberInk);background:var(--amberBg);border:.5px solid rgba(229,162,75,.3);padding:3px 9px;border-radius:20px}
.demo-tag .d{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.shift{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;border:.5px solid var(--lineS);color:var(--muted)}
.shift.open{border-color:var(--mint);color:var(--mintInk)}
.shift.open .d{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.shift.closed .d{width:6px;height:6px;border-radius:50%;background:var(--subtle)}
.clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
.branch-sel{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:var(--s2);border:.5px solid var(--lineS);padding:6px 11px;border-radius:7px}
.branch-sel svg{width:14px;height:14px;color:var(--teal)}
.stage{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:15px}
.foot{border-top:.5px solid var(--line);background:var(--panel);flex-shrink:0}
.foot-prog{height:3px;background:var(--line)}
.foot-prog .f{height:100%;background:linear-gradient(90deg,rgba(21,242,242,.3),var(--teal));transition:width .4s}
.foot-in{display:flex;align-items:center;gap:18px;padding:13px 24px}
.narr{flex:1;min-width:0}
.narr .nt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.narr .nt .ch{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--tealInk);background:var(--tealBg);padding:2px 7px;border-radius:5px}
.narr .nc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.narr .nc .ai{color:var(--aiInk);font-weight:600}
.ctrls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cbtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:8px;border:.5px solid var(--lineS);background:var(--s2);color:var(--ink)}
.cbtn:hover{background:var(--s3)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn svg{width:15px;height:15px}
.cbtn.play{background:var(--teal);border-color:var(--teal);color:var(--inv);min-width:118px;justify-content:center}
.cbtn.play.on{background:var(--aiBg);border-color:var(--ai);color:var(--aiInk)}
.counter{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--subtle);min-width:72px;text-align:right}
.card{background:var(--raised);border:.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:12px}
.card-h h4{font-size:13.5px;font-weight:600}
.card-h .sub{font-size:11px;color:var(--subtle)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);font-weight:600}
.field{border:.5px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--panel)}
.field-l{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);margin-bottom:5px}
.field-v{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.mini{text-align:center;padding:12px;border:.5px solid var(--line);border-radius:8px;background:var(--s2)}
.mini .v{font-family:'JetBrains Mono',monospace;font-size:22px}.mini .l{font-size:10px;color:var(--subtle);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:.5px solid var(--lineS);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--muted);background:transparent;cursor:pointer}
.chip.on{border-color:var(--teal);color:var(--tealInk);background:var(--tealBg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;padding:3px 9px;border-radius:6px;font-weight:600;text-transform:uppercase}
.pill.mint{background:var(--mintBg);color:var(--mintInk)}.pill.amber{background:var(--amberBg);color:var(--amberInk)}
.pill.danger{background:var(--dangerBg);color:var(--dangerInk)}.pill.teal{background:var(--tealBg);color:var(--tealInk)}
.pill.blue{background:var(--blueBg);color:var(--blueInk)}.pill.neutral{background:var(--s3);color:var(--muted)}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);font-weight:500;padding:0 10px 10px;border-bottom:.5px solid var(--lineS)}
.dt th.r{text-align:right}
.dt td{padding:10px;border-bottom:.5px solid var(--line)}
.dt td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.dt tr.drill{cursor:pointer}.dt tr.drill:hover td{background:var(--s2)}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:8px;border:.5px solid var(--lineS);background:var(--s2);color:var(--ink)}
.btn:hover{background:var(--s3)}.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--inv)}
.btn.primary:hover{filter:brightness(1.08)}.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.warn{background:var(--amberBg);border-color:var(--amber);color:var(--amberInk)}
.btn.sm{padding:6px 11px;font-size:11.5px}.btn svg{width:14px;height:14px}
.sw{width:38px;height:21px;border-radius:20px;background:var(--s3);border:.5px solid var(--lineS);position:relative;flex-shrink:0;display:inline-block;vertical-align:middle}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--subtle);transition:transform .15s}
.sw.on{background:rgba(21,242,242,.22);border-color:var(--teal)}.sw.on::after{transform:translateX(17px);background:var(--teal)}
.iris-note{border-left:2px solid var(--ai);background:var(--aiBg);border-radius:8px;padding:11px 14px;font-size:12px;line-height:1.55;color:var(--muted)}
.iris-note b{color:var(--aiInk)}
.iris-note .lyr{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--aiInk);font-weight:700;margin-bottom:5px;display:block}
.rv{opacity:0;transform:translateY(8px);animation:rv .4s forwards}
@keyframes rv{to{opacity:1;transform:none}}
.term{display:grid;grid-template-columns:1fr 320px;gap:15px}
.tmenu{border:.5px solid var(--line);border-radius:var(--r);background:var(--raised);padding:15px;display:flex;flex-direction:column;gap:13px}
.tcats{display:flex;gap:7px;flex-wrap:wrap}
.tcat{font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;border:.5px solid var(--line);background:var(--s2);color:var(--muted)}
.tcat.on{background:var(--s3);color:var(--ink);border-color:var(--lineS)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.ttile{border:.5px solid var(--line);border-radius:9px;background:var(--s2);padding:12px;text-align:left}
.ttile:hover{border-color:var(--teal)}
.ttile .nm{font-size:12px;font-weight:600;min-height:32px;line-height:1.25}
.ttile .pr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);margin-top:8px;font-weight:600}
.ttile .mo{font-size:9px;color:var(--subtle);margin-top:3px}
.tcart{border:.5px solid var(--line);border-radius:var(--r);background:var(--raised);display:flex;flex-direction:column;overflow:hidden}
.cart-h{padding:12px 14px;border-bottom:.5px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-h .t{font-weight:700}
.cart-meta{padding:8px 14px;border-bottom:.5px solid var(--line);display:flex;gap:8px;font-size:11px;color:var(--subtle)}
.cart-ot{display:flex;gap:4px;padding:9px 13px;border-bottom:.5px solid var(--line)}
.cart-ot button{flex:1;font-size:11px;font-weight:600;padding:7px 4px;border-radius:6px;border:.5px solid var(--line);background:var(--s2);color:var(--muted)}
.cart-ot button.on{background:var(--tealBg);border-color:var(--teal);color:var(--tealInk)}
.cart-lines{flex:1;overflow-y:auto;padding:6px 12px;min-height:130px;max-height:300px}
.cline{display:flex;gap:9px;padding:9px 2px;border-bottom:.5px solid var(--line);align-items:flex-start}
.cline .q{font-family:'JetBrains Mono',monospace;color:var(--teal);font-weight:600}
.cline .cn{flex:1;font-size:12.5px;font-weight:600}
.cline .cm{font-size:10px;color:var(--subtle);margin-top:2px}
.cline .cp{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600}
.cline .rm{color:var(--subtle);font-size:15px;line-height:1;padding:0 2px;cursor:pointer}.cline .rm:hover{color:var(--danger)}
.cline.void{opacity:.45}.cline.void .cn{text-decoration:line-through}
.cart-empty{color:var(--subtle);text-align:center;padding:32px 12px;font-size:12px;line-height:1.5}
.cart-tot{padding:11px 14px;border-top:.5px solid var(--lineS)}
.trow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}
.trow.g{font-size:15px;font-weight:700;color:var(--ink);margin-top:6px;padding-top:8px;border-top:.5px solid var(--line)}.trow.g .v{font-family:'JetBrains Mono',monospace}
.cart-act{padding:11px 14px;display:flex;flex-direction:column;gap:8px;border-top:.5px solid var(--line)}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.den{border:.5px solid var(--line);border-radius:8px;background:var(--panel);padding:11px 13px;display:flex;align-items:center;justify-content:space-between}
.den .dl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.den .dc{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.den .dv{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tealInk);min-width:56px;text-align:right}
.count-tot{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:.5px solid var(--lineS);border-radius:10px;background:var(--s2);margin-top:12px}
.count-tot .l{font-size:12px;color:var(--subtle);text-transform:uppercase;letter-spacing:.05em;font-family:'JetBrains Mono',monospace}
.count-tot .v{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:13px}
.chk .cb{width:20px;height:20px;border-radius:6px;background:var(--mintBg);color:var(--mint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk .cb svg{width:12px;height:12px}
.inq{display:flex;flex-direction:column;gap:10px}
.inorder{border:.5px solid var(--line);border-radius:10px;background:var(--raised);padding:13px 15px;display:flex;align-items:center;gap:14px}
.inorder.new{border-color:var(--amber);box-shadow:0 0 0 1px rgba(229,162,75,.2)}
.inorder .ch-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;flex-shrink:0}
.chb-ue{background:#1f1405;color:#E8BD78}.chb-dl{background:#22101a;color:#FF8FC0}.chb-wo{background:#062028;color:#7DEAEF}.chb-app{background:#07232B;color:#7DEAEF}.chb-din{background:#0E2A1F;color:#A6E6C8}
.inorder .io-main{flex:1;min-width:0}
.inorder .io-t{font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.inorder .io-s{font-size:11px;color:var(--subtle);margin-top:2px}
.inorder .io-v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;text-align:right}
.inorder .io-vs{font-size:10px;color:var(--subtle);text-align:right;margin-top:2px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:220px;margin:0 auto}
.pk{border:.5px solid var(--lineS);border-radius:9px;background:var(--s2);padding:15px;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600}
.pk:hover{background:var(--s3)}
.pindots{display:flex;gap:12px;justify-content:center;margin:8px 0 18px}
.pindots .pd{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--lineS)}
.pindots .pd.f{background:var(--teal);border-color:var(--teal)}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,20,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal{background:var(--panel);border:.5px solid var(--lineS);border-radius:15px;box-shadow:var(--shL);width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.modal-h{padding:15px 19px;border-bottom:.5px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h .t{font-size:14.5px;font-weight:600}.modal-h .x{color:var(--subtle);font-size:22px;line-height:1;cursor:pointer}
.modal-b{padding:17px 19px}
.mo{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:.5px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--s2);cursor:pointer}
.mo.on{border-color:var(--teal);background:var(--tealBg)}.mo .ml{font-size:13px;font-weight:600}.mo .mp{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.paym{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.pm{border:.5px solid var(--line);border-radius:9px;background:var(--s2);padding:14px;text-align:center;font-size:12.5px;font-weight:600}
.pm:hover{border-color:var(--teal)}.pm.on{border-color:var(--teal);background:var(--tealBg);color:var(--tealInk)}.pm svg{width:20px;height:20px;display:block;margin:0 auto 7px}
.tips{display:flex;gap:8px;margin-bottom:14px}
.tipb{flex:1;border:.5px solid var(--line);border-radius:8px;background:var(--s2);padding:9px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.tipb.on{border-color:var(--teal);background:var(--tealBg);color:var(--tealInk)}
.receipt{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--s2);border:.5px dashed var(--lineS);border-radius:8px;padding:17px;line-height:1.8}
.receipt .c{text-align:center}.receipt hr{border:0;border-top:1px dashed var(--lineS);margin:9px 0}.receipt .l{display:flex;justify-content:space-between}
.approved{text-align:center;padding:20px}
.approved .ring{width:64px;height:64px;border-radius:50%;background:var(--mintBg);color:var(--mint);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pop .4s}
.approved .ring svg{width:32px;height:32px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);border:.5px solid var(--lineS);border-left:3px solid var(--mint);border-radius:11px;padding:12px 19px;box-shadow:var(--shL);font-size:12.5px;font-weight:600;opacity:0;transition:.25s;z-index:99;display:flex;align-items:center;gap:10px;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast svg{width:16px;height:16px;color:var(--mint)}
.toast.ai{border-left-color:var(--ai)}.toast.ai svg{color:var(--ai)}
.toast.amber{border-left-color:var(--amber)}.toast.amber svg{color:var(--amber)}
.perm{display:grid;grid-template-columns:1fr auto}
.perm>div{padding:9px 12px;border-bottom:.5px solid var(--line);display:flex;align-items:center}
.perm .pv{justify-content:flex-end;font-family:'JetBrains Mono',monospace;font-size:11.5px}
.tick{color:var(--mint)}.cross{color:var(--subtle)}
.qk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.qk{border:.5px solid var(--line);border-radius:8px;background:var(--s2);padding:12px 8px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}

function countUp(el,dur){var raw=el.textContent.trim();var m=raw.match(/^([^0-9+\-]*)([+\-]?[0-9.,]+)(.*)$/);if(!m)return;var pre=m[1],ns=m[2],suf=m[3];var sign=ns[0]==='+'?'+':(ns[0]==='-'?'-':'');var clean=ns.replace(/^[+\-]/,'');var hasComma=clean.indexOf(',')>=0;var dec=(clean.split('.')[1]||'').length;var target=parseFloat(clean.replace(/,/g,''));if(isNaN(target))return;function fmt(v){var out=dec?v.toFixed(dec):String(Math.round(v));if(hasComma){var parts=out.split('.');parts[0]=Number(parts[0]).toLocaleString('en-US');out=parts.join('.');}return pre+sign+out+suf;}var start=performance.now();el.textContent=fmt(0);function fr(t){var p=Math.min(1,(t-start)/dur);var e=1-Math.pow(1-p,3);el.textContent=fmt(target*e);if(p<1)requestAnimationFrame(fr);}requestAnimationFrame(fr);}

function sZenOps(){function opsBar(l,p,v){return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span>'+l+'</span><span class="mono" style="color:var(--ink)">'+(v||p+'%')+'</span></div><div class="opsbar"><div class="opsfill" style="width:'+p+'%"></div></div></div>';}var tasks=[['Opening checklist','8/8','done','mint'],['Temperature log \u00b7 fridges','logged','done','mint'],['Hand-wash audit','due 12:00','due','amber'],['Allergen chart check','done','done','mint'],['Cleaning \u2014 front of house','2/5','behind','amber'],['Closing checklist','\u2014','pending','neutral']];var trows=tasks.map(function(t){return '<tr><td><b>'+t[0]+'</b></td><td class="num">'+t[1]+'</td><td><span class="pill '+t[3]+'">'+t[2]+'</span></td></tr>';}).join('');$('#stage').innerHTML='<div class="kbar rv">'+kb('Checklist completion','86%','12 of 14 tasks','up')+kb('Audit score','A \u00b7 94','audited 08:40','up')+kb('Tasks due','2','next 12:00','warn')+kb('Food-safety','100%','all logs on time','up')+'</div><div class="grid2" style="align-items:start"><div class="card rv" style="animation-delay:.05s"><div class="card-h"><h4>Today\u2019s routines</h4><span class="sub">SOP execution</span></div><table class="dt"><thead><tr><th>Task</th><th class="r">Progress</th><th>Status</th></tr></thead><tbody>'+trows+'</tbody></table></div><div class="card rv" style="animation-delay:.08s"><div class="card-h"><h4>Ops KPIs</h4></div>'+opsBar('Order accuracy',98)+opsBar('Ticket time',82,'6m12s')+opsBar('Table turn',76)+opsBar('Complaint rate',96,'0.4%')+opsBar('Staff on-time',90)+'</div></div><div class="card rv" style="animation-delay:.12s;border-left:2px solid var(--ai)"><div class="card-h"><h4 style="color:var(--aiInk)">Iris \u2014 Ops input</h4></div><div style="font-size:13px;color:var(--muted);line-height:1.7">Two routines are slipping: the <b style="color:var(--ink)">hand-wash audit</b> is due at 12:00 and front-of-house cleaning is behind (2/5). Both tend to slip on rainy lunch rushes \u2014 assign them now while it\u2019s quiet. Everything else is green and the morning audit scored A. Ticket time is the one soft KPI at 6m12s; the Steak Frites station is the bottleneck.</div></div>';}
function sCrossSell(){var pairs=[['Poulet Frites','Limonade Maison',71,1.40],['Croque Signature','Caf\u00e9',54,2.10],['Steak Frites','Vin \u2014 verre',48,6.50],['Salade Ni\u00e7oise','Eau min\u00e9rale',63,3.20],['Any Croque','Cr\u00e8me Br\u00fbl\u00e9e',38,6.40]];var rows=pairs.map(function(p){return '<tr><td><b>'+p[0]+'</b></td><td>'+IC.plus+' '+p[1]+'</td><td class="num"><span class="pill '+(p[2]>=60?'mint':p[2]>=45?'teal':'amber')+'">'+p[2]+'%</span></td><td class="num">+'+eur(p[3])+'</td></tr>';}).join('');$('#stage').innerHTML='<div class="kbar rv">'+kb('Attach rate','58%','of tickets','up')+kb('Uplift / ticket','+\u20ac2.80','average','up')+kb('Suggestions','1,240','accepted 46%','')+kb('Extra revenue','\u20ac612','today','up')+'</div><div class="card rv" style="animation-delay:.05s;border-left:2px solid var(--ai)"><div class="card-h"><h4 style="color:var(--aiInk)">Iris cross-sell \u2014 what to suggest</h4><span class="sub">ranked by attach \u00d7 margin</span></div><table class="dt"><thead><tr><th>When they order</th><th>Suggest</th><th class="r">Attach</th><th class="r">Uplift</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="grid2" style="align-items:start"><div class="card rv" style="animation-delay:.1s"><div class="card-h"><h4>Live at the till</h4></div><div style="font-size:12.5px;color:var(--muted);line-height:1.7">On the order screen Iris surfaces the top pairing for the current cart as a one-tap chip \u2014 so the cashier suggests it without thinking. Accepted suggestions are learned per outlet and per daypart.</div><div class="chips" style="margin-top:12px"><span class="chip">+ Limonade \u00b7 71%</span><span class="chip">+ Cr\u00e8me Br\u00fbl\u00e9e</span><span class="chip">Make it a meal</span></div></div><div class="card rv" style="animation-delay:.14s"><div class="card-h"><h4>Bundles Iris built</h4></div>'+[['Menu du jour','Croque + drink + dessert','\u20ac16.90'],['Le D\u00e9jeuner','Plat + boisson','\u20ac14.50'],['Go\u00fbter','Caf\u00e9 + p\u00e2tisserie','\u20ac7.90']].map(function(x){return '<div class="trow"><span><b>'+x[0]+'</b> <span style="color:var(--subtle)">\u00b7 '+x[1]+'</span></span><span class="mono">'+x[2]+'</span></div>';}).join('')+'</div></div>'+irisNote('L2 Zen Models','Poulet Frites \u2192 Limonade attaches <b>71%</b> when prompted vs 44% unprompted \u2014 about \u20ac1.40 a ticket. I re-rank these nightly from what actually sold, so the cashier is always suggesting the thing most likely to land.');}
function openMenuSetup(id){var it=findItem(id);var m=margin(it);var img=TILEIMG[id]?'<div class="dm-blur" style="background-image:url('+TILEIMG[id]+')"></div><img class="dm-fg" src="'+TILEIMG[id]+'" alt="">':'<div style="margin:auto;color:var(--subtle);font-size:13px">No image</div>';var desc=DESC[id]||'A Maison Croq favourite, made to order.';var mods=it.mods.length?it.mods.map(function(mk){return MODIFIERS[mk].label;}).join(' \u00b7 '):'None';var mt=m>=60?'mint':m>=45?'amber':'danger';var bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';bg.innerHTML='<div class="modal detail-modal"><span class="x" onclick="closeModal()">\u00d7</span><div class="dm-grid"><div class="dm-photo">'+img+'<button class="btn sm" style="position:absolute;bottom:12px;left:12px;z-index:2" onclick="toast(IC.check,\'Photo library \u2014 upload or pick\')">Change photo</button></div><div class="dm-info"><div class="dm-name">'+esc(it.nm)+'</div><div class="field-l" style="margin:8px 0 6px">Description</div><div class="ms-field">'+esc(desc)+'</div><div class="grid3" style="margin-top:16px">'+field('Price',eur(it.pr))+field('Recipe cost',eur(it.cost))+field('Margin','<span class="pill '+mt+'">'+m+'%</span>')+'</div><div class="field-l" style="margin:16px 0 6px">Modifiers</div><div class="ms-field">'+mods+'</div><div class="field-l" style="margin:16px 0 8px">Allergens</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+['Gluten','Dairy','Egg'].map(function(a){return '<span class="pill neutral">'+a+'</span>';}).join('')+'</div><div class="dm-foot"><span class="pill mint">'+IC.check+' Published \u00b7 all channels</span><button class="btn primary" onclick="closeModal();toast(IC.check,\'Menu item saved\')">Save item</button></div></div></div></div>';bg.addEventListener('click',function(e){if(e.target===bg)closeModal();});document.body.appendChild(bg);}
